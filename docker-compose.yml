version: "3.8"

services:

  backend:
    build: ./backend
    container_name: fastapi
    restart: always
    expose:
      - "8000"
    volumes:
      - E:/MesProjets/backend/data:/app/data  # chemin absolu Windows vers le dossier data

  frontend:
    build: ./frontend
    container_name: nextjs
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost
    expose:
      - "3000"

  nginx:
    build: ./nginx
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
